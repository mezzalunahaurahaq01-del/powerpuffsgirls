<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quattro Group's Project</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigasi -->
  <header class="nav-wrap">
    <nav class="nav" aria-label="Navigasi utama">
      <a href="#" class="nav-link is-active" aria-current="page">Home</a>
      <a href="#design" class="nav-link">Design</a>
      <a href="#product" class="nav-link">Product</a>
    </nav>
  </header>

  <!-- Hero -->
  <main class="hero">
    <div class="logo" role="img" aria-label="Logo Quattro Group: semanggi daun empat">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="#5e8f72" stroke="#0d1a12" stroke-width="2.2" stroke-linejoin="round">
          <!-- daun atas -->
          <path d="M100 100 C78 86 70 62 78 44 C86 28 112 26 124 38 C134 50 128 80 100 100Z"/>
          <!-- daun kanan -->
          <path d="M100 100 C114 78 138 70 156 78 C172 86 174 112 162 124 C150 134 120 128 100 100Z"/>
          <!-- daun bawah -->
          <path d="M100 100 C122 114 130 138 122 156 C114 172 88 174 76 162 C66 150 72 120 100 100Z"/>
          <!-- daun kiri -->
          <path d="M100 100 C86 122 62 130 44 122 C28 114 26 88 38 76 C50 66 80 72 100 100Z"/>
        </g>
        <!-- garis silang -->
        <g stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none">
          <line x1="100" y1="42" x2="100" y2="158"/>
          <line x1="42" y1="100" x2="158" y2="100"/>
          <path d="M88 42 Q100 40 112 42"/>
          <path d="M88 158 Q100 160 112 158"/>
          <path d="M42 88 Q40 100 42 112"/>
          <path d="M158 88 Q160 100 158 112"/>
        </g>
        <!-- aksen tengah -->
        <g stroke="#fff" stroke-width="1.4" fill="none">
          <path d="M92 92 L100 100 L92 100"/>
          <path d="M108 92 L100 100 L108 100"/>
          <path d="M92 108 L100 100 L92 100"/>
          <path d="M108 108 L100 100 L108 100"/>
        </g>
      </svg>
    </div>

    <h1 class="title">Welcome to Quattro Group's Project</h1>

    <p class="tagline">
      Empat anggota, satu panggung. Semangat kami: pendidikan yang berkualitas
      dan mudah dijangkau lewat teknologi.
    </p>
  </main>

  <!-- Tombol menu mengambang -->
  <button class="fab" type="button" aria-label="Menu lainnya">
    <span></span><span></span><span></span>
  </button>

  <!-- Footer -->
  <footer class="footer">
    <span class="footer-left">Version 1.0</span>
    <span class="footer-center">Quattro Group</span>
    <span class="footer-right">Powered by Claude</span>
  </footer>

  <script>
    // Ganti tab aktif di navigasi
    document.querySelectorAll('.nav-link').forEach(function (link) {
      link.addEventListener('click', function () {
        document.querySelectorAll('.nav-link').forEach(function (l) {
          l.classList.remove('is-active');
          l.removeAttribute('aria-current');
        });
        link.classList.add('is-active');
        link.setAttribute('aria-current', 'page');
      });
    });
  </script>
</body>
</html>
